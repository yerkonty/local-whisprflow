[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-whisprflow"
version = "0.1.0"
description = "A free, local, offline voice-dictation tool for Windows"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "pyperclip",
    "keyboard",
    "pystray",
    "Pillow",
]

[project.optional-dependencies]
dev =  ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]